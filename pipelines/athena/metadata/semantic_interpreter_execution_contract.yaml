    metrics:
      - total_points
    dimensions:
      - player_name
    required_filter_kinds:
      - exact_season
      - season_type
    time_grain: null
    linked_filters:
      - target_object: Team
        attribute: team_name
        required: true
    allow_limit: false
    require_order_by_metric: true
    comparison:
