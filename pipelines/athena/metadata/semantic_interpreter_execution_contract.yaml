# Temporary execution capability contract for the Gemini interpreter.
# Ontology remains the semantic source of truth.
# This contract exists only because planner/runtime execution support still lags
# the full ontology surface, so the interpreter needs a small explicit record of
# current execution-shape limits.
# Remove or shrink this contract as those execution limits become representable
# in ontology/planning, rather than letting it grow into a second ontology.

version: 1

comparison_entities:
  - jalen_brunson
  - tyrese_haliburton

allowed_assumptions:
  - "Interpreted 'pts' as total points."
  - "Interpreted 'scoring' as total points."
  - "Interpreted 'scorers' as players ranked by total points."
  - "Interpreted 'scorer' as players ranked by total points."
  - "Interpreted 'avg points' as average points."
  - "Interpreted 'average scoring' as average points."

families:
  - family_key: player_recent_metric
    query_kind: metric_query
    core_fact_object: PlayerGame
    metrics:
      - total_points
      - average_points
    dimensions:
      - player_name
    required_filter_kinds:
      - last_n_games
    time_grain: null
    linked_filters: []
    allow_limit: true
    require_order_by_metric: true
    comparison:
      enabled: false

  - family_key: player_recent_metric_team_filter
    query_kind: metric_query
    core_fact_object: PlayerGame
    metrics:
      - total_points
      - average_points
    dimensions:
      - player_name
    required_filter_kinds:
      - last_n_games
    time_grain: null
    linked_filters:
      - target_object: Team
        attribute: team_name
        required: true
    allow_limit: true
    require_order_by_metric: true
    comparison:
      enabled: false

  - family_key: player_recent_comparison
    query_kind: metric_query
    core_fact_object: PlayerGame
    metrics:
      - total_points
    dimensions:
      - player_name
    required_filter_kinds:
      - last_n_games
    time_grain: null
    linked_filters: []
    allow_limit: false
    require_order_by_metric: false
    comparison:
      enabled: true
      entities:
        - jalen_brunson
        - tyrese_haliburton
      max_entities: 2

  - family_key: player_recent_object
    query_kind: object_query
    core_fact_object: PlayerGame
    row_object: Player
    metrics:
      - total_points
    dimensions:
      - player_name
    required_filter_kinds:
      - last_n_games
    time_grain: null
    linked_filters: []
    allow_limit: false
    require_order_by_metric: true
    comparison:
      enabled: false

  - family_key: player_recent_object_team_filter
    query_kind: object_query
    core_fact_object: PlayerGame
    row_object: Player
    metrics:
      - total_points
    dimensions:
      - player_name
    required_filter_kinds:
      - last_n_games
    time_grain: null
    linked_filters:
      - target_object: Team
        attribute: team_name
        required: true
    allow_limit: false
    require_order_by_metric: true
    comparison:
      enabled: false

  - family_key: team_recent_metric
    query_kind: metric_query
    core_fact_object: TeamGame
    metrics:
      - average_points
    dimensions:
      - team_name
    required_filter_kinds:
      - last_n_games
    time_grain: null
    linked_filters: []
    allow_limit: true
    require_order_by_metric: true
    comparison:
      enabled: false

  - family_key: team_monthly_trend
    query_kind: metric_query
    core_fact_object: TeamGame
    metrics:
      - average_points
    dimensions: []
    required_filter_kinds:
      - past_year
    time_grain: month
    linked_filters: []
    allow_limit: false
    require_order_by_metric: false
    comparison:
      enabled: false

  - family_key: team_monthly_trend_by_team
    query_kind: metric_query
    core_fact_object: TeamGame
    metrics:
      - average_points
    dimensions:
      - team_name
    required_filter_kinds:
      - past_year
    time_grain: month
    linked_filters: []
    allow_limit: false
    require_order_by_metric: false
    comparison:
      enabled: false

  - family_key: player_season_metric
    query_kind: metric_query
    core_fact_object: PlayerSeason
    metrics:
      - average_points
    dimensions:
      - player_name
    required_filter_kinds:
      - exact_season
      - season_type
    time_grain: null
    linked_filters: []
    allow_limit: true
    require_order_by_metric: true
    comparison:
      enabled: false

  - family_key: player_season_object
    query_kind: object_query
    core_fact_object: PlayerSeason
    row_object: Player
    metrics:
      - total_points
    dimensions:
      - player_name
    required_filter_kinds:
      - exact_season
      - season_type
    time_grain: null
    linked_filters: []
    allow_limit: false
    require_order_by_metric: true
    comparison:
      enabled: false

  - family_key: player_season_team_metric
    query_kind: metric_query
    core_fact_object: PlayerSeasonTeam
    metrics:
      - average_points
    dimensions:
      - player_name
    required_filter_kinds:
      - exact_season
      - season_type
    time_grain: null
    linked_filters:
      - target_object: Team
        attribute: team_name
        required: true
    allow_limit: true
    require_order_by_metric: true
    comparison:
      enabled: false

  - family_key: player_season_team_object
    query_kind: object_query
    core_fact_object: PlayerSeasonTeam
