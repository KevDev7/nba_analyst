# Temporary execution exception list for the Gemini interpreter.
# Ontology remains the semantic source of truth, and planner-derived
# capabilities are now the main source of supported query shapes.
# This file exists only for residual interpreter exceptions that the planner
# does not yet express cleanly on its own.
# Remove or shrink this file over time rather than letting it grow back into
# a second ontology or a second planner.

version: 1

allowed_assumptions:
  - "Interpreted 'pts' as total points."
  - "Interpreted 'scoring' as total points."
  - "Interpreted 'scorers' as players ranked by total points."
  - "Interpreted 'scorer' as players ranked by total points."
  - "Interpreted 'avg points' as average points."
  - "Interpreted 'average scoring' as average points."
