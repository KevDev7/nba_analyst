services:
  - type: web
    name: nba-analyst-api
    runtime: docker
    dockerfilePath: ./deploy/render/backend.Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_INTERPRETER_PROVIDER
        value: google
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite-preview
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3-flash-preview
      - key: LLM_INTERPRETER_ATTEMPTS_PER_MODEL
        value: "1"
      - key: LLM_INTERPRETER_TEMPERATURE
        value: "0"
      - key: NBA_ONTOLOGY_PLANNER_BIN
        value: /app/bin/ontology-hs
      - key: NBA_DISABLE_SNAPSHOT_REBUILD
        value: "1"
      - key: NBA_ALLOWED_ORIGINS
        value: https://nba-insight-mdpl.onrender.com
      - key: NBA_ENABLE_PUBLIC_DEBUG
        value: "0"
      - key: NBA_MAX_QUESTION_CHARS
        value: "4000"
      - key: NBA_ENABLE_MODEL_ORCHESTRATOR
        value: "0"
      - key: NBA_MODEL_ORCHESTRATOR_DRY_RUN
        value: "0"
      - key: NBA_ENABLE_MODEL_TOOL_LOOP
        value: "0"
      - key: NBA_ENABLE_MODEL_ANSWER_COMPOSER
        value: "0"
      - key: NBA_ENABLE_PYTHON_CODE_SANDBOX
        value: "0"
      - key: NBA_PYTHON_CODE_SANDBOX_BACKEND
        value: local_beta
      - key: NBA_RUN_LIVE_E2B_TESTS
        value: "0"
  - type: web
    name: nba-insight-mdpl
    runtime: static
    buildCommand: npm ci --prefix apps/web-ui && npm --prefix apps/web-ui run build
    staticPublishPath: apps/web-ui/build
    envVars:
      - key: PUBLIC_API_BASE_URL
        value: https://nba-analyst-api.onrender.com
      - key: PUBLIC_MAX_QUESTION_CHARS
        value: "4000"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
