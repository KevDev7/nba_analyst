      WHEN MOD(CAST(FLOOR(CAST((COALESCE(three_pointers_attempted, 0) * 1000) AS DOUBLE)
      / (field_goals_attempted)) AS BIGINT), 2) = 0 THEN FLOOR(CAST((COALESCE(three_pointers_attempted,
      0) * 1000) AS DOUBLE) / (field_goals_attempted)) / 1000.0 ELSE (FLOOR(CAST((COALESCE(three_pointers_attempted,
      0) * 1000) AS DOUBLE) / (field_goals_attempted)) + 1) / 1000.0 END ELSE ROUND(CAST(COALESCE(three_pointers_attempted,
