      * points_total), 0) * 10) AS DOUBLE) / ((50 * field_goals_attempted_total +
      22 * free_throws_attempted_total))) AS BIGINT), 2) = 0 THEN FLOOR(CAST((COALESCE((2500
      * points_total), 0) * 10) AS DOUBLE) / ((50 * field_goals_attempted_total +
      22 * free_throws_attempted_total))) / 10.0 ELSE (FLOOR(CAST((COALESCE((2500
      * points_total), 0) * 10) AS DOUBLE) / ((50 * field_goals_attempted_total +
      22 * free_throws_attempted_total))) + 1) / 10.0 END ELSE ROUND(CAST(COALESCE((2500
      * points_total), 0) AS DOUBLE) / ((50 * field_goals_attempted_total + 22 * free_throws_attempted_total)),
      1) END ELSE NULL END ELSE NULL END
