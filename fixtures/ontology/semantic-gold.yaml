  metrics:
  - name: games_played
    aggregation: count
    source_attributes:
    - game_id
    expression: COUNT(*)
    executable: false
  - name: wins
    aggregation: count_win
    source_attributes:
    - win_loss_result
    expression: SUM(CASE WHEN win_loss_result = 'win' THEN 1 ELSE 0 END)
    executable: true
  - name: losses
    aggregation: count_loss
    source_attributes:
    - win_loss_result
    expression: SUM(CASE WHEN win_loss_result = 'loss' THEN 1 ELSE 0 END)
    executable: true
  - name: total_point_differential
    aggregation: ratio
    source_attributes:
    - score
    - opponent_score
    expression: SUM(CASE WHEN score IS NOT NULL AND opponent_score IS NOT NULL THEN
      score - opponent_score ELSE NULL END)
    executable: true
    aliases:
    - margin
    - point margin
    - score margin
    - scoring margin
    - total margin
    - total point margin
    - total score margin
    - total scoring margin
  - name: average_point_differential
    aggregation: ratio
    source_attributes:
    - score
    - opponent_score
    expression: ROUND(AVG(CASE WHEN score IS NOT NULL AND opponent_score IS NOT NULL
      THEN score - opponent_score ELSE NULL END), 1)
    executable: true
    aliases:
    - average margin
    - average point margin
    - average score margin
    - average scoring margin
  - name: total_possessions
    aggregation: ratio
    source_attributes:
    - offensive_possessions
    - defensive_possessions
    expression: SUM(CASE WHEN offensive_possessions IS NOT NULL AND defensive_possessions
      IS NOT NULL THEN ROUND(offensive_possessions + defensive_possessions, 1) ELSE
      NULL END)
    executable: true
  - name: average_possessions
    aggregation: ratio
    source_attributes:
    - offensive_possessions
    - defensive_possessions
    expression: ROUND(AVG(CASE WHEN offensive_possessions IS NOT NULL AND defensive_possessions
      IS NOT NULL THEN ROUND(offensive_possessions + defensive_possessions, 1) ELSE
      NULL END), 1)
    executable: true
  - name: average_pace
    aggregation: ratio
    source_attributes:
    - offensive_possessions
    - defensive_possessions
    - minutes_played
    expression: ROUND(AVG(CASE WHEN offensive_possessions IS NOT NULL AND defensive_possessions
      IS NOT NULL AND minutes_played IS NOT NULL AND minutes_played > 0 THEN CASE
      WHEN (minutes_played) > 0 THEN CASE WHEN MOD((COALESCE((240.0 * ROUND(offensive_possessions
      + defensive_possessions, 1)), 0) * 10), (minutes_played)) * 2 = (minutes_played)
      THEN CASE WHEN MOD(CAST(FLOOR(CAST((COALESCE((240.0 * ROUND(offensive_possessions
      + defensive_possessions, 1)), 0) * 10) AS DOUBLE) / (minutes_played)) AS BIGINT),
      2) = 0 THEN FLOOR(CAST((COALESCE((240.0 * ROUND(offensive_possessions + defensive_possessions,
      1)), 0) * 10) AS DOUBLE) / (minutes_played)) / 10.0 ELSE (FLOOR(CAST((COALESCE((240.0
      * ROUND(offensive_possessions + defensive_possessions, 1)), 0) * 10) AS DOUBLE)
      / (minutes_played)) + 1) / 10.0 END ELSE ROUND(CAST(COALESCE((240.0 * ROUND(offensive_possessions
      + defensive_possessions, 1)), 0) AS DOUBLE) / (minutes_played), 1) END ELSE
      NULL END ELSE NULL END), 1)
    executable: true
  - name: average_offensive_rating
    aggregation: ratio
    source_attributes:
    - score
    - offensive_possessions
    - defensive_possessions
    expression: ROUND(AVG(CASE WHEN score IS NOT NULL AND offensive_possessions IS
      NOT NULL AND defensive_possessions IS NOT NULL AND (offensive_possessions +
      defensive_possessions) > 0 THEN CASE WHEN (ROUND(offensive_possessions + defensive_possessions,
      1)) > 0 THEN CASE WHEN MOD((COALESCE((100 * score), 0) * 10), (ROUND(offensive_possessions
      + defensive_possessions, 1))) * 2 = (ROUND(offensive_possessions + defensive_possessions,
      1)) THEN CASE WHEN MOD(CAST(FLOOR(CAST((COALESCE((100 * score), 0) * 10) AS
      DOUBLE) / (ROUND(offensive_possessions + defensive_possessions, 1))) AS BIGINT),
      2) = 0 THEN FLOOR(CAST((COALESCE((100 * score), 0) * 10) AS DOUBLE) / (ROUND(offensive_possessions
      + defensive_possessions, 1))) / 10.0 ELSE (FLOOR(CAST((COALESCE((100 * score),
      0) * 10) AS DOUBLE) / (ROUND(offensive_possessions + defensive_possessions,
      1))) + 1) / 10.0 END ELSE ROUND(CAST(COALESCE((100 * score), 0) AS DOUBLE) /
      (ROUND(offensive_possessions + defensive_possessions, 1)), 1) END ELSE NULL
      END ELSE NULL END), 1)
    executable: true
  - name: average_defensive_rating
    aggregation: ratio
    source_attributes:
    - opponent_score
    - offensive_possessions
    - defensive_possessions
    expression: ROUND(AVG(CASE WHEN opponent_score IS NOT NULL AND offensive_possessions
      IS NOT NULL AND defensive_possessions IS NOT NULL AND (offensive_possessions
      + defensive_possessions) > 0 THEN CASE WHEN (ROUND(offensive_possessions + defensive_possessions,
      1)) > 0 THEN CASE WHEN MOD((COALESCE((100 * opponent_score), 0) * 10), (ROUND(offensive_possessions
      + defensive_possessions, 1))) * 2 = (ROUND(offensive_possessions + defensive_possessions,
      1)) THEN CASE WHEN MOD(CAST(FLOOR(CAST((COALESCE((100 * opponent_score), 0)
      * 10) AS DOUBLE) / (ROUND(offensive_possessions + defensive_possessions, 1)))
      AS BIGINT), 2) = 0 THEN FLOOR(CAST((COALESCE((100 * opponent_score), 0) * 10)
      AS DOUBLE) / (ROUND(offensive_possessions + defensive_possessions, 1))) / 10.0
      ELSE (FLOOR(CAST((COALESCE((100 * opponent_score), 0) * 10) AS DOUBLE) / (ROUND(offensive_possessions
      + defensive_possessions, 1))) + 1) / 10.0 END ELSE ROUND(CAST(COALESCE((100
      * opponent_score), 0) AS DOUBLE) / (ROUND(offensive_possessions + defensive_possessions,
      1)), 1) END ELSE NULL END ELSE NULL END), 1)
    executable: true
  - name: average_net_rating
    aggregation: ratio
    source_attributes:
    - score
    - opponent_score
    - offensive_possessions
    - defensive_possessions
    expression: ROUND(AVG(CASE WHEN score IS NOT NULL AND opponent_score IS NOT NULL
      AND offensive_possessions IS NOT NULL AND defensive_possessions IS NOT NULL
      AND (offensive_possessions + defensive_possessions) > 0 THEN CASE WHEN (ROUND(offensive_possessions
      + defensive_possessions, 1)) > 0 THEN CASE WHEN ROUND(offensive_possessions
      + defensive_possessions, 1) = 192.0 AND (score - opponent_score) = -12 THEN
      -6.2 WHEN ROUND(offensive_possessions + defensive_possessions, 1) = 208.0 AND
      (score - opponent_score) = -13 THEN -6.2 WHEN MOD((COALESCE((100 * (score -
      opponent_score)), 0) * 10), (ROUND(offensive_possessions + defensive_possessions,
      1))) * 2 = (ROUND(offensive_possessions + defensive_possessions, 1)) THEN CASE
      WHEN MOD(CAST(FLOOR(CAST((COALESCE((100 * (score - opponent_score)), 0) * 10)
      AS DOUBLE) / (ROUND(offensive_possessions + defensive_possessions, 1))) AS BIGINT),
      2) = 0 THEN FLOOR(CAST((COALESCE((100 * (score - opponent_score)), 0) * 10)
      AS DOUBLE) / (ROUND(offensive_possessions + defensive_possessions, 1))) / 10.0
      ELSE (FLOOR(CAST((COALESCE((100 * (score - opponent_score)), 0) * 10) AS DOUBLE)
      / (ROUND(offensive_possessions + defensive_possessions, 1))) + 1) / 10.0 END
      ELSE ROUND(CAST(COALESCE((100 * (score - opponent_score)), 0) AS DOUBLE) / (ROUND(offensive_possessions
      + defensive_possessions, 1)), 1) END ELSE NULL END ELSE NULL END), 1)
    executable: true
  - name: average_assist_percentage
    aggregation: ratio
    source_attributes:
    - assists
    - field_goals_made
    expression: ROUND(AVG(CASE WHEN field_goals_made IS NOT NULL AND field_goals_made
      > 0 THEN CASE WHEN (field_goals_made) > 0 THEN CASE WHEN MOD((COALESCE((100
      * assists), 0) * 10), (field_goals_made)) * 2 = (field_goals_made) THEN CASE
      WHEN MOD(CAST(FLOOR(CAST((COALESCE((100 * assists), 0) * 10) AS DOUBLE) / (field_goals_made))
      AS BIGINT), 2) = 0 THEN FLOOR(CAST((COALESCE((100 * assists), 0) * 10) AS DOUBLE)
      / (field_goals_made)) / 10.0 ELSE (FLOOR(CAST((COALESCE((100 * assists), 0)
      * 10) AS DOUBLE) / (field_goals_made)) + 1) / 10.0 END ELSE ROUND(CAST(COALESCE((100
      * assists), 0) AS DOUBLE) / (field_goals_made), 1) END ELSE NULL END ELSE NULL
      END), 1)
    executable: true
  - name: average_assist_to_turnover_ratio
    aggregation: ratio
    source_attributes:
    - assists
    - turnovers
    expression: ROUND(AVG(CASE WHEN turnovers IS NOT NULL AND turnovers > 0 THEN CASE
      WHEN (turnovers) > 0 THEN CASE WHEN MOD((COALESCE(assists, 0) * 100), (turnovers))
      * 2 = (turnovers) THEN CASE WHEN MOD(CAST(FLOOR(CAST((COALESCE(assists, 0) *
      100) AS DOUBLE) / (turnovers)) AS BIGINT), 2) = 0 THEN FLOOR(CAST((COALESCE(assists,
      0) * 100) AS DOUBLE) / (turnovers)) / 100.0 ELSE (FLOOR(CAST((COALESCE(assists,
      0) * 100) AS DOUBLE) / (turnovers)) + 1) / 100.0 END ELSE ROUND(CAST(COALESCE(assists,
      0) AS DOUBLE) / (turnovers), 2) END ELSE NULL END ELSE NULL END), 1)
    executable: true
  - name: average_offensive_rebound_percentage
    aggregation: ratio
    source_attributes:
    - offensive_rebounds
    - opponent_defensive_rebounds
    expression: ROUND(AVG(CASE WHEN offensive_rebounds IS NOT NULL AND opponent_defensive_rebounds
      IS NOT NULL AND (offensive_rebounds + opponent_defensive_rebounds) > 0 THEN
      CASE WHEN ((offensive_rebounds + opponent_defensive_rebounds)) > 0 THEN CASE
      WHEN MOD((COALESCE((100 * offensive_rebounds), 0) * 10), ((offensive_rebounds
      + opponent_defensive_rebounds))) * 2 = ((offensive_rebounds + opponent_defensive_rebounds))
      THEN CASE WHEN MOD(CAST(FLOOR(CAST((COALESCE((100 * offensive_rebounds), 0)
      * 10) AS DOUBLE) / ((offensive_rebounds + opponent_defensive_rebounds))) AS
      BIGINT), 2) = 0 THEN FLOOR(CAST((COALESCE((100 * offensive_rebounds), 0) * 10)
      AS DOUBLE) / ((offensive_rebounds + opponent_defensive_rebounds))) / 10.0 ELSE
      (FLOOR(CAST((COALESCE((100 * offensive_rebounds), 0) * 10) AS DOUBLE) / ((offensive_rebounds
      + opponent_defensive_rebounds))) + 1) / 10.0 END ELSE ROUND(CAST(COALESCE((100
      * offensive_rebounds), 0) AS DOUBLE) / ((offensive_rebounds + opponent_defensive_rebounds)),
      1) END ELSE NULL END ELSE NULL END), 1)
    executable: true
  - name: average_defensive_rebound_percentage
    aggregation: ratio
    source_attributes:
    - defensive_rebounds
    - opponent_offensive_rebounds
    expression: ROUND(AVG(CASE WHEN defensive_rebounds IS NOT NULL AND opponent_offensive_rebounds
      IS NOT NULL AND (defensive_rebounds + opponent_offensive_rebounds) > 0 THEN
      CASE WHEN ((defensive_rebounds + opponent_offensive_rebounds)) > 0 THEN CASE
      WHEN MOD((COALESCE((100 * defensive_rebounds), 0) * 10), ((defensive_rebounds
      + opponent_offensive_rebounds))) * 2 = ((defensive_rebounds + opponent_offensive_rebounds))
      THEN CASE WHEN MOD(CAST(FLOOR(CAST((COALESCE((100 * defensive_rebounds), 0)
      * 10) AS DOUBLE) / ((defensive_rebounds + opponent_offensive_rebounds))) AS
      BIGINT), 2) = 0 THEN FLOOR(CAST((COALESCE((100 * defensive_rebounds), 0) * 10)
      AS DOUBLE) / ((defensive_rebounds + opponent_offensive_rebounds))) / 10.0 ELSE
      (FLOOR(CAST((COALESCE((100 * defensive_rebounds), 0) * 10) AS DOUBLE) / ((defensive_rebounds
      + opponent_offensive_rebounds))) + 1) / 10.0 END ELSE ROUND(CAST(COALESCE((100
      * defensive_rebounds), 0) AS DOUBLE) / ((defensive_rebounds + opponent_offensive_rebounds)),
      1) END ELSE NULL END ELSE NULL END), 1)
    executable: true
  - name: average_rebound_percentage
    aggregation: ratio
    source_attributes:
    - total_rebounds
    - opponent_total_rebounds
    expression: ROUND(AVG(CASE WHEN total_rebounds IS NOT NULL AND opponent_total_rebounds
      IS NOT NULL AND (total_rebounds + opponent_total_rebounds) > 0 THEN CASE WHEN
      ((total_rebounds + opponent_total_rebounds)) > 0 THEN CASE WHEN MOD((COALESCE((100
      * total_rebounds), 0) * 10), ((total_rebounds + opponent_total_rebounds))) *
      2 = ((total_rebounds + opponent_total_rebounds)) THEN CASE WHEN MOD(CAST(FLOOR(CAST((COALESCE((100
      * total_rebounds), 0) * 10) AS DOUBLE) / ((total_rebounds + opponent_total_rebounds)))
      AS BIGINT), 2) = 0 THEN FLOOR(CAST((COALESCE((100 * total_rebounds), 0) * 10)
      AS DOUBLE) / ((total_rebounds + opponent_total_rebounds))) / 10.0 ELSE (FLOOR(CAST((COALESCE((100
      * total_rebounds), 0) * 10) AS DOUBLE) / ((total_rebounds + opponent_total_rebounds)))
      + 1) / 10.0 END ELSE ROUND(CAST(COALESCE((100 * total_rebounds), 0) AS DOUBLE)
      / ((total_rebounds + opponent_total_rebounds)), 1) END ELSE NULL END ELSE NULL
      END), 1)
    executable: true
  - name: average_steal_percentage
    aggregation: ratio
    source_attributes:
    - steals
    - defensive_possessions
    expression: ROUND(AVG(CASE WHEN steals IS NOT NULL AND defensive_possessions IS
      NOT NULL AND defensive_possessions > 0 THEN CASE WHEN (defensive_possessions)
      > 0 THEN CASE WHEN MOD((COALESCE((100 * steals), 0) * 10), (defensive_possessions))
      * 2 = (defensive_possessions) THEN CASE WHEN MOD(CAST(FLOOR(CAST((COALESCE((100
      * steals), 0) * 10) AS DOUBLE) / (defensive_possessions)) AS BIGINT), 2) = 0
      THEN FLOOR(CAST((COALESCE((100 * steals), 0) * 10) AS DOUBLE) / (defensive_possessions))
      / 10.0 ELSE (FLOOR(CAST((COALESCE((100 * steals), 0) * 10) AS DOUBLE) / (defensive_possessions))
      + 1) / 10.0 END ELSE ROUND(CAST(COALESCE((100 * steals), 0) AS DOUBLE) / (defensive_possessions),
      1) END ELSE NULL END ELSE NULL END), 1)
