  - name: average_effective_field_goal_percentage
    aggregation: ratio
    source_attributes:
    - field_goals_made
    - three_pointers_made
    - field_goals_attempted
    expression: ROUND(AVG(CASE WHEN field_goals_attempted IS NOT NULL AND field_goals_attempted
      > 0 THEN CASE WHEN (field_goals_attempted) > 0 THEN CASE WHEN MOD((COALESCE((100
      * field_goals_made + 50 * three_pointers_made), 0) * 10), (field_goals_attempted))
      * 2 = (field_goals_attempted) THEN CASE WHEN MOD(CAST(FLOOR(CAST((COALESCE((100
      * field_goals_made + 50 * three_pointers_made), 0) * 10) AS DOUBLE) / (field_goals_attempted))
      AS BIGINT), 2) = 0 THEN FLOOR(CAST((COALESCE((100 * field_goals_made + 50 *
      three_pointers_made), 0) * 10) AS DOUBLE) / (field_goals_attempted)) / 10.0
      ELSE (FLOOR(CAST((COALESCE((100 * field_goals_made + 50 * three_pointers_made),
      0) * 10) AS DOUBLE) / (field_goals_attempted)) + 1) / 10.0 END ELSE ROUND(CAST(COALESCE((100
      * field_goals_made + 50 * three_pointers_made), 0) AS DOUBLE) / (field_goals_attempted),
      1) END ELSE NULL END ELSE NULL END), 1)
    executable: true
  - name: average_true_shooting_percentage
    aggregation: ratio
    source_attributes:
    - score
    - field_goals_attempted
    - free_throws_attempted
    expression: ROUND(AVG(CASE WHEN score IS NOT NULL AND (50 * field_goals_attempted
      + 22 * free_throws_attempted) > 0 THEN CASE WHEN ((50 * field_goals_attempted
      + 22 * free_throws_attempted)) > 0 THEN CASE WHEN MOD((COALESCE((2500 * score),
      0) * 10), ((50 * field_goals_attempted + 22 * free_throws_attempted))) * 2 =
      ((50 * field_goals_attempted + 22 * free_throws_attempted)) THEN CASE WHEN MOD(CAST(FLOOR(CAST((COALESCE((2500
      * score), 0) * 10) AS DOUBLE) / ((50 * field_goals_attempted + 22 * free_throws_attempted)))
      AS BIGINT), 2) = 0 THEN FLOOR(CAST((COALESCE((2500 * score), 0) * 10) AS DOUBLE)
      / ((50 * field_goals_attempted + 22 * free_throws_attempted))) / 10.0 ELSE (FLOOR(CAST((COALESCE((2500
      * score), 0) * 10) AS DOUBLE) / ((50 * field_goals_attempted + 22 * free_throws_attempted)))
