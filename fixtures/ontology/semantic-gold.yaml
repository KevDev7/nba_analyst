    executable: true
  - name: average_free_throw_attempt_rate
    aggregation: ratio
    source_attributes:
    - free_throws_attempted
    - field_goals_attempted
    expression: ROUND(AVG(CASE WHEN (field_goals_attempted) > 0 THEN CASE WHEN MOD((COALESCE(free_throws_attempted,
      0) * 1000), (field_goals_attempted)) * 2 = (field_goals_attempted) THEN CASE
      WHEN MOD(CAST(FLOOR(CAST((COALESCE(free_throws_attempted, 0) * 1000) AS DOUBLE)
      / (field_goals_attempted)) AS BIGINT), 2) = 0 THEN FLOOR(CAST((COALESCE(free_throws_attempted,
      0) * 1000) AS DOUBLE) / (field_goals_attempted)) / 1000.0 ELSE (FLOOR(CAST((COALESCE(free_throws_attempted,
      0) * 1000) AS DOUBLE) / (field_goals_attempted)) + 1) / 1000.0 END ELSE ROUND(CAST(COALESCE(free_throws_attempted,
      0) AS DOUBLE) / (field_goals_attempted), 3) END ELSE NULL END), 1)
    executable: true
  - name: average_assist_to_turnover_ratio
    aggregation: ratio
    source_attributes:
    - assists
    - turnovers
    expression: ROUND(AVG(CASE WHEN (turnovers) > 0 THEN CASE WHEN MOD((COALESCE(assists,
      0) * 100), (turnovers)) * 2 = (turnovers) THEN CASE WHEN MOD(CAST(FLOOR(CAST((COALESCE(assists,
      0) * 100) AS DOUBLE) / (turnovers)) AS BIGINT), 2) = 0 THEN FLOOR(CAST((COALESCE(assists,
      0) * 100) AS DOUBLE) / (turnovers)) / 100.0 ELSE (FLOOR(CAST((COALESCE(assists,
      0) * 100) AS DOUBLE) / (turnovers)) + 1) / 100.0 END ELSE ROUND(CAST(COALESCE(assists,
      0) AS DOUBLE) / (turnovers), 2) END ELSE NULL END), 1)
    executable: true
  - name: average_field_goals_percentage
    aggregation: ratio
    source_attributes:
    - field_goals_made
    - field_goals_attempted
    expression: ROUND(AVG(CASE WHEN (field_goals_attempted) > 0 THEN CASE WHEN (field_goals_attempted)
      = 20 AND field_goals_made = 3 THEN 0.1 WHEN (field_goals_attempted) = 20 AND
      field_goals_made = 7 THEN 0.3 WHEN (field_goals_attempted) = 20 AND field_goals_made
      = 9 THEN 0.5 WHEN (field_goals_attempted) = 20 AND field_goals_made = 13 THEN
